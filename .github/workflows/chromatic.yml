name: 'Chromatic Deployment'

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'styles/**'
      - '.storybook/**'
  pull_request:
    paths:
      - 'src/**'
      - 'styles/**'
      - '.storybook/**'

permissions:
  contents: read

jobs:
  chromatic-deployment:
    # Runs on every PR touching components, styles or Storybook config. Gating on
    # a `deploy-storybook` label meant visual changes reached main unchecked
    # whenever the label was forgotten, which is most of the time.
    #
    # Fork PRs are excluded: `github.repository` resolves to the BASE repo for
    # them, so the check below would pass, but GitHub withholds
    # CHROMATIC_PROJECT_TOKEN from fork PRs. The step would then run without a
    # token and fail. Same-repo PRs and pushes to main are still checked.
    if: github.repository == 'rad-ui/ui' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Required for Chromatic to retrieve git history

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci  # Use 'yarn install --frozen-lockfile' if you use Yarn

      - name: Publish to Chromatic
        uses: chromaui/action@v1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Gating is intentional: a visual regression should fail the PR.
          # Do not add --exit-zero-on-changes here without also recording why
          # the snapshot is known to be unstable.
          maxStoryBuildTraces: 0
